name: check

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Unit tests
        run: python skills/dsimage/scripts/test_dsimage.py
      - name: Check bundled templates
        working-directory: skills/dsimage
        run: |
          set -e
          for t in templates/*/; do python scripts/dsimage.py template check "$t"; done
